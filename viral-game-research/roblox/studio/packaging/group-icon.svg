<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#232b52"/><stop offset="1" stop-color="#0a0d1c"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0.7" y2="0.3">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.85"/><stop offset="1" stop-color="#ffd166" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd98a"/><stop offset="0.5" stop-color="#d9a441"/><stop offset="1" stop-color="#9c6b1f"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#fff3b0"/><stop offset="1" stop-color="#ffcc33" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- flashlight beam from bottom-left onto the frame -->
  <polygon points="40,512 0,470 210,150 420,300" fill="url(#beam)"/>
  <!-- ornate frame -->
  <rect x="136" y="96" width="240" height="290" rx="14" fill="url(#gold)"/>
  <rect x="152" y="112" width="208" height="258" rx="8" fill="#7a5418"/>
  <rect x="164" y="124" width="184" height="234" rx="4" fill="#0d1022"/>
  <circle cx="136" cy="96" r="16" fill="url(#gold)"/><circle cx="376" cy="96" r="16" fill="url(#gold)"/>
  <circle cx="136" cy="386" r="16" fill="url(#gold)"/><circle cx="376" cy="386" r="16" fill="url(#gold)"/>
  <!-- glowing eyes in the dark painting -->
  <ellipse cx="220" cy="236" rx="34" ry="22" fill="url(#eye)"/>
  <ellipse cx="292" cy="236" rx="34" ry="22" fill="url(#eye)"/>
  <ellipse cx="220" cy="236" rx="7" ry="13" fill="#1a1200"/>
  <ellipse cx="292" cy="236" rx="7" ry="13" fill="#1a1200"/>
  <!-- wordmark -->
  <text x="256" y="448" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900"
        font-size="44" letter-spacing="3" fill="#ffd98a">LATE SHIFT</text>
</svg>
